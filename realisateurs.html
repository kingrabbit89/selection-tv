<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Réalisateurs</title><link rel="stylesheet" href="assets/css/site.css?v=20260924-editorial" /></head><body class="realisateurs-page"><header><div class="wrap top"><div class="brand">SÉLECTION TV</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="calendrier.html">Calendrier</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Réalisateurs</h1><div class="deck">Les cinéastes déjà identifiés dans le catalogue. Les fiches se complètent à mesure que leurs films réapparaissent dans la sélection.</div><div class="controls"><input id="q" placeholder="Rechercher un réalisateur…"></div><div class="grid" id="grid"></div></main><script>
let groups=[];const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');fetch('data/works.json').then(r=>r.json()).then(d=>{const m=new Map();d.works.filter(x=>x.director).forEach(x=>{x.director.split(/\s*\/\s*|\s*&\s*/).forEach(n=>{n=n.trim();if(!n)return;if(!m.has(n))m.set(n,[]);m.get(n).push(x)})});groups=[...m].sort((a,b)=>a[0].localeCompare(b[0],'fr'));const n=new URLSearchParams(location.search).get('nom');if(n)document.getElementById('q').value=n;render()});function render(){const z=norm(document.getElementById('q').value);document.getElementById('grid').innerHTML=groups.filter(([n])=>!z||norm(n).includes(z)).map(([n,ws])=>'<article class="card"><h2>'+n+'</h2><div class="meta">'+ws.length+' œuvre'+(ws.length>1?'s':'')+' repérée'+(ws.length>1?'s':'')+'</div><div class="history">'+ws.map(x=>'<div style="margin-top:8px"><a href="oeuvre.html?id='+encodeURIComponent(x.id)+'" style="color:#172238;font-weight:900">'+x.title+'</a> <span class="small">'+(x.year||'')+'</span></div>').join('')+'</div></article>').join('')}document.getElementById('q').oninput=render;
</script></body></html>
