<style>
.selectionTvHost{position:relative;width:100%;height:calc(100vh - 92px);margin:0;padding:0}
.selectionTvFrame{width:100%;height:100%;border:0;display:block;background:#111}
.selectionTvBridgeStatus{position:absolute;right:12px;top:10px;z-index:20;padding:5px 8px;background:#20262d;color:#ddd;border:1px solid #4b5560;font:12px Arial,sans-serif;opacity:.94;pointer-events:none}
.selectionTvBridgeStatus.ok{background:#183629;border-color:#3f7c5a;color:#dff5e7}
.selectionTvBridgeStatus.err{background:#4a2424;border-color:#8a4d4d;color:#ffdede}
</style>

<div class="selectionTvHost">
  <div id="selectionTvBridgeStatus" class="selectionTvBridgeStatus">Connexion Jellyfin…</div>
  <iframe
    id="selectionTvFrame"
    class="selectionTvFrame"
    src="https://kingrabbit89.github.io/selection-tv/latest.html"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>

<script>
(function(){
  var CHILD_ORIGIN='https://kingrabbit89.github.io';
  var frame=document.getElementById('selectionTvFrame');
  var status=document.getElementById('selectionTvBridgeStatus');
  var lookupCache=new Map();
  var inflight=0;
  var maxConcurrent=2;
  var queue=[];
  var tested=0;
  var found=0;
  if(!frame)return;

  function norm(s){
    return String(s||'')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,' ')
      .replace(/\bmr\b/g,'mister')
      .replace(/\bmrs\b/g,'missus')
      .replace(/\bdr\b/g,'doctor')
      .replace(/\s+/g,' ')
      .trim();
  }

  function api(){
    if(window.ApiClient)return window.ApiClient;
    if(window.ServerConnections&&typeof window.ServerConnections.currentApiClient==='function'){
      return window.ServerConnections.currentApiClient();
    }
    return null;
  }

  function setStatus(text,kind){
    if(!status)return;
    status.textContent=text;
    status.className='selectionTvBridgeStatus'+(kind?' '+kind:'');
  }

  function providerIds(item){
    return item&&item.ProviderIds||item&&item.providerIds||{};
  }

  function imdbOf(item){
    var ids=providerIds(item);
    return String(ids.Imdb||ids.IMDb||ids.imdb||'').toLowerCase();
  }

  function tmdbOf(item){
    var ids=providerIds(item);
    return String(ids.Tmdb||ids.TMDb||ids.tmdb||'');
  }

  function titleCandidates(title){
    var raw=String(title||'').trim();
    var out=[];
    function add(v){
      v=String(v||'').replace(/\s+/g,' ').trim();
      if(v&&out.map(norm).indexOf(norm(v))===-1)out.push(v);
    }
    add(raw);
    var par=[...raw.matchAll(/\(([^()]{2,100})\)/g)].map(function(m){return m[1]});
    par.forEach(add);
    add(raw.replace(/\s*\([^()]+\)\s*/g,' ').replace(/\s+/g,' '));
    if(/\s+-\s+/.test(raw))add(raw.split(/\s+-\s+/)[0]);
    return out.slice(0,3);
  }

  var libraryIndexPromise=null;
  var libraryIndexCurrent=null;
  var libraryIndexRefreshPromise=null;
  var libraryDetailCache=new Map();
  var persistentMatches=null;
  var LIBRARY_CACHE_VERSION=3;
  var LIBRARY_CACHE_TTL=12*60*60*1000;
  var MATCH_CACHE_TTL=30*24*60*60*1000;

  function cacheIdentity(){
    var a=api();
    var server='';
    try{server=typeof a.serverId==='function'?a.serverId():''}catch(e){}
    if(!server){
      try{server=String(a.serverAddress&&a.serverAddress()||location.origin)}catch(e){server=location.origin}
    }
    var user='';
    try{user=String(a.getCurrentUserId&&a.getCurrentUserId()||'')}catch(e){}
    return norm(server)+'|'+user;
  }

  function libraryCacheKey(){
    return 'selectionTv_library_index_v'+LIBRARY_CACHE_VERSION+'|'+cacheIdentity();
  }

  function matchCacheKey(){
    return 'selectionTv_library_matches_v'+LIBRARY_CACHE_VERSION+'|'+cacheIdentity();
  }

  function compactItem(item){
    var ids=providerIds(item);
    return [
      item.Id||item.id||'',
      item.Name||item.name||'',
      item.OriginalTitle||item.originalTitle||'',
      Number(item.ProductionYear||item.productionYear)||0,
      String(ids.Imdb||ids.IMDb||ids.imdb||''),
      String(ids.Tmdb||ids.TMDb||ids.tmdb||''),
      item.Type||item.type||''
    ];
  }

  function inflateItem(row){
    return {
      Id:row[0]||'',
      Name:row[1]||'',
      OriginalTitle:row[2]||'',
      ProductionYear:Number(row[3])||0,
      ProviderIds:{Imdb:row[4]||'',Tmdb:row[5]||''},
      Type:row[6]||''
    };
  }

  function pushMap(map,key,item){
    if(!key)return;
    var list=map.get(key);
    if(!list){list=[];map.set(key,list)}
    list.push(item);
  }

  function makeLibraryIndex(items){
    var index={
      items:items||[],
      byImdb:new Map(),
      byTmdb:new Map(),
      byName:new Map()
    };

    index.items.forEach(function(item){
      var imdb=imdbOf(item);
      var tmdb=tmdbOf(item);
      if(imdb)pushMap(index.byImdb,imdb,item);
      if(tmdb)pushMap(index.byTmdb,tmdb,item);
      [item.Name,item.name,item.OriginalTitle,item.originalTitle].filter(Boolean).forEach(function(name){
        pushMap(index.byName,norm(name),item);
      });
    });

    return index;
  }

  function loadLibraryCache(){
    try{
      var raw=localStorage.getItem(libraryCacheKey());
      if(!raw)return null;
      var parsed=JSON.parse(raw);
      if(!parsed||parsed.version!==LIBRARY_CACHE_VERSION||!Array.isArray(parsed.items))return null;
      return {
        savedAt:Number(parsed.savedAt)||0,
        index:makeLibraryIndex(parsed.items.map(inflateItem))
      };
    }catch(e){
      return null;
    }
  }

  function loadPersistentMatches(){
    if(persistentMatches)return persistentMatches;
    try{
      var parsed=JSON.parse(localStorage.getItem(matchCacheKey())||'{}');
      persistentMatches=parsed&&typeof parsed==='object'?parsed:{};
    }catch(e){
      persistentMatches={};
    }
    return persistentMatches;
  }

  function savePersistentMatches(){
    try{localStorage.setItem(matchCacheKey(),JSON.stringify(loadPersistentMatches()))}catch(e){}
  }

  function prunePersistentMatches(index){
    var valid=new Set(index.items.map(function(item){return item.Id||item.id||''}).filter(Boolean));
    var matches=loadPersistentMatches();
    var changed=false;
    Object.keys(matches).forEach(function(key){
      var m=matches[key];
      if(!m||!valid.has(m.itemId)||Date.now()-(Number(m.savedAt)||0)>MATCH_CACHE_TTL){
        delete matches[key];
        changed=true;
      }
    });
    if(changed)savePersistentMatches();
  }

  function saveLibraryCache(index){
    try{
      localStorage.setItem(libraryCacheKey(),JSON.stringify({
        version:LIBRARY_CACHE_VERSION,
        savedAt:Date.now(),
        items:index.items.map(compactItem)
      }));
      prunePersistentMatches(index);
    }catch(e){}
  }

  function rememberPositiveMatch(key,result){
    if(!result||!result.found||!result.itemId)return;
    var matches=loadPersistentMatches();
    matches[key]={
      itemId:result.itemId,
      name:result.name||'',
      played:!!result.played,
      quality:result.quality||'',
      savedAt:Date.now()
    };
    savePersistentMatches();
  }

  function cachedPositiveMatch(key){
    var matches=loadPersistentMatches();
    var m=matches[key];
    if(!m||!m.itemId)return null;
    if(Date.now()-(Number(m.savedAt)||0)>MATCH_CACHE_TTL){
      delete matches[key];
      savePersistentMatches();
      return null;
    }
    return {
      key:key,
      found:true,
      itemId:m.itemId,
      name:m.name||'',
      played:!!m.played,
      quality:m.quality||'',
      cached:true
    };
  }

  async function buildLibraryIndex(){
    var a=api();
    if(!a||typeof a.getItems!=='function'||typeof a.getCurrentUserId!=='function'){
      throw new Error('API Jellyfin indisponible');
    }

    var all=[];
    var seenIds={};
    var startIndex=0;
    var pageSize=200;
    var userId=a.getCurrentUserId();
    var expectedTotal=0;

    do{
      var r=await a.getItems(userId,{
        Recursive:true,
        IncludeItemTypes:'Movie,Series',
        Fields:'ProviderIds,OriginalTitle',
        EnableTotalRecordCount:true,
        EnableImages:false,
        EnableUserData:false,
        StartIndex:startIndex,
        Limit:pageSize
      });
      var batch=r&&r.Items||r&&r.items||[];
      expectedTotal=Number(r&&r.TotalRecordCount||r&&r.totalRecordCount)||expectedTotal;

      var added=0;
      batch.forEach(function(item){
        var id=item.Id||item.id||'';
        if(!id||seenIds[id])return;
        seenIds[id]=1;
        all.push(item);
        added++;
      });

      if(!batch.length)break;
      startIndex+=batch.length;
      if(expectedTotal&&startIndex>=expectedTotal)break;
      if(!added)break;
      if(!expectedTotal&&batch.length<pageSize)break;
    }while(startIndex<50000);

    return makeLibraryIndex(all);
  }

  function refreshLibraryIndex(background){
    if(libraryIndexRefreshPromise)return libraryIndexRefreshPromise;
    if(!background)setStatus('Jellyfin · préparation de l’index…','ok');

    libraryIndexRefreshPromise=buildLibraryIndex().then(function(index){
      libraryIndexCurrent=index;
      saveLibraryCache(index);
      setStatus('Jellyfin · bibliothèque synchronisée · '+index.items.length+' œuvres','ok');
      return index;
    }).catch(function(err){
      if(!libraryIndexCurrent)setStatus('Jellyfin · recherche ciblée de secours','ok');
      throw err;
    }).finally(function(){
      libraryIndexRefreshPromise=null;
    });

    return libraryIndexRefreshPromise;
  }

  function ensureLibraryIndex(){
    if(libraryIndexCurrent)return Promise.resolve(libraryIndexCurrent);
    if(libraryIndexPromise)return libraryIndexPromise;

    var cached=loadLibraryCache();
    if(cached&&cached.index.items.length){
      libraryIndexCurrent=cached.index;
      libraryIndexPromise=Promise.resolve(libraryIndexCurrent);
      var age=Date.now()-cached.savedAt;
      setStatus('Jellyfin · cache bibliothèque · '+libraryIndexCurrent.items.length+' œuvres','ok');

      if(age>LIBRARY_CACHE_TTL){
        setTimeout(function(){
          refreshLibraryIndex(true).catch(function(){});
        },1200);
      }
      return libraryIndexPromise;
    }

    libraryIndexPromise=refreshLibraryIndex(false).finally(function(){
      libraryIndexPromise=null;
    });
    return libraryIndexPromise;
  }

  function uniqueItems(items){
    var seen={};
    return (items||[]).filter(function(item){
      var id=item.Id||item.id||'';
      if(!id||seen[id])return false;
      seen[id]=1;
      return true;
    });
  }

  function exactIndexMatch(index,req){
    var reqImdb=String(req.imdbId||'').toLowerCase();
    var reqTmdb=String(req.tmdbId||'');

    if(reqImdb){
      var byImdb=uniqueItems(index.byImdb.get(reqImdb));
      if(byImdb.length)return byImdb[0];
    }
    if(reqTmdb){
      var byTmdb=uniqueItems(index.byTmdb.get(reqTmdb));
      if(byTmdb.length)return byTmdb[0];
    }

    var names=titleCandidates(req.title).map(norm).filter(Boolean);
    var candidates=[];
    names.forEach(function(name){
      candidates=candidates.concat(index.byName.get(name)||[]);
    });
    candidates=uniqueItems(candidates);
    if(!candidates.length)return null;

    var reqYear=Number(req.year)||0;
    if(reqYear){
      var exactYear=candidates.filter(function(item){
        return (Number(item.ProductionYear||item.productionYear)||0)===reqYear;
      });
      if(exactYear.length)return exactYear[0];

      var nearYear=candidates.filter(function(item){
        var y=Number(item.ProductionYear||item.productionYear)||0;
        return y&&Math.abs(y-reqYear)<=1;
      });
      if(nearYear.length===1)return nearYear[0];
      return null;
    }

    return candidates.length===1?candidates[0]:null;
  }

  async function hydrateLibraryItem(item){
    if(!item)return null;
    var a=api();
    var id=item.Id||item.id;
    if(!id)return item;
    if(libraryDetailCache.has(id))return libraryDetailCache.get(id);

    var promise=(async function(){
      try{
        var r=await a.getItems(a.getCurrentUserId(),{
          Ids:[id],
          Fields:'ProviderIds,OriginalTitle,UserData,MediaSources,Genres,Overview,People,CommunityRating,ImageTags',
          EnableTotalRecordCount:false,
          Limit:1
        });
        var items=r&&r.Items||r&&r.items||[];
        return items[0]||item;
      }catch(e){
        return item;
      }
    })();

    libraryDetailCache.set(id,promise);
    return promise;
  }

  async function findLibraryIndexItem(req){
    var index=await ensureLibraryIndex();
    return exactIndexMatch(index,req);
  }

  async function findLibraryItem(req){
    var match=await findLibraryIndexItem(req);
    return match?hydrateLibraryItem(match):null;
  }

  // Reused by the private-upload enrichment below. It returns a Jellyfin
  // BaseItemDto, not just a yes/no badge, so one compact persistent index can
  // serve both the static magazine and the changing private upload section.
  window.SelectionTvFindLibraryItem=findLibraryItem;

  function scoreItem(item,req){
    var score=0;
    var targetNames=titleCandidates(req.title).map(norm);
    var names=[item.Name,item.name,item.OriginalTitle,item.originalTitle].filter(Boolean).map(norm);
    var itemYear=Number(item.ProductionYear||item.productionYear)||0;
    var reqYear=Number(req.year)||0;
    var itemImdb=imdbOf(item);
    var itemTmdb=tmdbOf(item);

    if(req.imdbId&&itemImdb&&itemImdb===String(req.imdbId).toLowerCase())score+=1000;
    if(req.tmdbId&&itemTmdb&&itemTmdb===String(req.tmdbId))score+=900;

    targetNames.forEach(function(t,idx){
      if(names.indexOf(t)!==-1)score=Math.max(score,160-idx*8);
      else if(names.some(function(n){return n.includes(t)||t.includes(n)}))score=Math.max(score,55-idx*5);
    });

    if(reqYear&&itemYear===reqYear)score+=60;
    else if(reqYear&&itemYear&&Math.abs(itemYear-reqYear)<=1)score+=10;

    return score;
  }

  async function fallbackSearch(req){
    var a=api();
    var candidates=titleCandidates(req.title);
    var all=[];
    var seen={};
    var successful=0;

    for(var i=0;i<candidates.length;i++){
      try{
        var r=await a.getItems(a.getCurrentUserId(),{
          Recursive:true,
          IncludeItemTypes:'Movie,Series',
          SearchTerm:candidates[i],
          Fields:'ProviderIds,OriginalTitle',
          EnableTotalRecordCount:false,
          Limit:16
        });
        successful++;
        var items=r&&r.Items||r&&r.items||[];
        items.forEach(function(item){
          var id=item.Id||item.id||JSON.stringify([item.Name,item.ProductionYear]);
          if(!seen[id]){seen[id]=1;all.push(item)}
        });
      }catch(e){}
    }

    if(!successful)throw new Error('Recherche Jellyfin temporairement indisponible');

    var ranked=all.map(function(item){
      return {item:item,score:scoreItem(item,req)};
    }).sort(function(a1,b1){return b1.score-a1.score});

    var best=ranked.length&&ranked[0].score>=150?ranked[0].item:null;
    return best?hydrateLibraryItem(best):null;
  }

  function resultFromItem(key,req,item){
    if(!item)return {key:key,found:false};

    var media=item.MediaSources||item.mediaSources||[];
    var quality='';
    if(media.length){
      var m=media[0]||{};
      var w=Number(m.Width||m.width)||0;
      if(w>=3800)quality='4K';
      else if(w>=1900)quality='1080p';
      else if(w>=1200)quality='720p';
    }

    return {
      key:key,
      found:true,
      itemId:item.Id||item.id,
      name:item.Name||item.name||req.title,
      played:!!((item.UserData||item.userData||{}).Played),
      quality:quality
    };
  }

  async function targetedLookup(req){
    var a=api();
    if(!a||typeof a.getItems!=='function'||typeof a.getCurrentUserId!=='function'){
      throw new Error('API Jellyfin indisponible');
    }

    var key=req.key||[norm(req.title),req.year||'',req.imdbId||'',req.tmdbId||''].join('|');
    if(lookupCache.has(key))return lookupCache.get(key);

    var persisted=cachedPositiveMatch(key);
    if(persisted){
      // Return immediately so "Dans Jellyfin" and "Ouvrir dans Jellyfin"
      // appear without rescanning the library. Refresh user/quality details
      // quietly in the background because those can change independently.
      (async function(){
        try{
          var detail=await hydrateLibraryItem({Id:persisted.itemId,Name:persisted.name});
          var fresh=resultFromItem(key,req,detail);
          if(fresh.found){
            rememberPositiveMatch(key,fresh);
            send({type:'selection-tv:jellyfin-result',version:3,items:[fresh]});
          }
        }catch(e){}
      })();
      return persisted;
    }

    var promise=(async function(){
      var item=null;
      try{
        item=await findLibraryIndexItem(req);
        if(item){
          // The compact index already contains the stable Jellyfin ID. Return
          // a verified match after one tiny detail lookup, not a full search.
          item=await hydrateLibraryItem(item);
        }
      }catch(e){}

      if(!item)item=await fallbackSearch(req);
      var result=resultFromItem(key,req,item);
      if(result.found)rememberPositiveMatch(key,result);
      return result;
    })().catch(function(){
      // Never persist or retain a negative result caused by a transient API
      // failure. A later opening/query gets a clean retry.
      lookupCache.delete(key);
      return {key:key,found:false,transient:true};
    });

    lookupCache.set(key,promise);
    return promise;
  }

  function send(payload){
    if(frame&&frame.contentWindow){
      frame.contentWindow.postMessage(payload,CHILD_ORIGIN);
    }
  }

  function selectionHostActive(){
    if(!frame||!document.body.contains(frame))return false;
    var r=frame.getBoundingClientRect();
    var cs=getComputedStyle(frame);
    return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0;
  }

  function pump(){
    if(!selectionHostActive())return;
    while(inflight<maxConcurrent&&queue.length){
      var job=queue.shift();
      inflight++;
      targetedLookup(job.req).then(function(result){
        tested++;
        if(result.found)found++;
        job.resolve(result);
      }).finally(function(){
        inflight--;
        setStatus('Jellyfin · '+found+' trouvé'+(found>1?'s':'')+' / '+tested+' testé'+(tested>1?'s':''),'ok');
        pump();
      });
    }
  }

  function queuedLookup(req){
    return new Promise(function(resolve){
      queue.push({req:req,resolve:resolve});
      pump();
    });
  }

  async function handleQueries(items){
    var unique=[];
    var seen={};
    (items||[]).forEach(function(x){
      if(x&&x.key&&!seen[x.key]){
        seen[x.key]=1;
        unique.push(x);
      }
    });

    if(!unique.length)return;

    var results=await Promise.all(unique.map(queuedLookup));
    send({type:'selection-tv:jellyfin-result',version:2,items:results});
  }

  window.addEventListener('message',function(e){
    if(e.source!==frame.contentWindow||e.origin!==CHILD_ORIGIN||!e.data)return;

    if(e.data.type==='selection-tv:jellyfin-query'&&Array.isArray(e.data.items)){
      handleQueries(e.data.items).catch(function(){});
    }

    if(e.data.type==='selection-tv:jellyfin-open'&&e.data.itemId){
      var a=api();
      var serverId=a&&typeof a.serverId==='function'?a.serverId():'';
      window.location.href='#/details?id='+encodeURIComponent(e.data.itemId)+(serverId?'&serverId='+encodeURIComponent(serverId):'');
    }
  });

  function ready(){
    var a=api();
    if(!a){
      setStatus('API Jellyfin indisponible','err');
      return;
    }
    ensureLibraryIndex().catch(function(){
      setStatus('Jellyfin connecté · recherche ciblée de secours','ok');
    });
    send({type:'selection-tv:jellyfin-ready',version:4});
  }

  frame.addEventListener('load',function(){
    ready();
    setTimeout(ready,500);
    setTimeout(ready,1500);
  });

  setTimeout(ready,700);
  setTimeout(ready,1800);
})();



/* ---- Jellyfin-only private uploads (inlined for Plugin Pages) ---- */
(function(){
  var CHILD_ORIGIN='https://kingrabbit89.github.io';
  var frame=document.getElementById('selectionTvFrame');
  var status=document.getElementById('selectionTvBridgeStatus');
  var privateTimer=null;
  var privateBusy=false;
  var lastPrivatePayload=null;
  var localSearchCache=new Map();
  var PRIVATE_CACHE_KEY='selectionTv_private_enriched_v1';

  function loadEnrichedCache(){
    try{
      var parsed=JSON.parse(sessionStorage.getItem(PRIVATE_CACHE_KEY)||'{}');
      return parsed&&typeof parsed==='object'?parsed:{};
    }catch(e){return {}}
  }

  function saveEnrichedCache(cache){
    try{sessionStorage.setItem(PRIVATE_CACHE_KEY,JSON.stringify(cache))}catch(e){}
  }

  function uploadCacheKey(upload){
    var url=upload.topicUrl||upload.TopicUrl||'';
    var at=upload.activityAt||upload.ActivityAt||'';
    return String(url)+'|'+String(at);
  }

  function hostActive(){
    if(!frame||!document.body.contains(frame))return false;
    var r=frame.getBoundingClientRect();
    var cs=getComputedStyle(frame);
    return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0;
  }

  if(!frame)return;

  function api(){
    if(window.ApiClient)return window.ApiClient;
    if(window.ServerConnections&&typeof window.ServerConnections.currentApiClient==='function'){
      return window.ServerConnections.currentApiClient();
    }
    return null;
  }

  function norm(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  }

  function arr(v){ return Array.isArray(v)?v:[]; }

  function titleCandidates(title){
    var raw=String(title||'').trim();
    var out=[];
    function add(v){
      v=String(v||'').replace(/\s+/g,' ').trim().replace(/^[\-–—:;,\s]+|[\-–—:;,\s]+$/g,'');
      if(v&&out.map(norm).indexOf(norm(v))===-1)out.push(v);
    }
    add(raw);
    var par=[...raw.matchAll(/\(([^()]{2,100})\)/g)].map(function(m){return m[1]});
    par.forEach(add);
    add(raw.replace(/\s*\([^()]+\)\s*/g,' ').replace(/\s+/g,' '));
    if(/\s+-\s+/.test(raw))add(raw.split(/\s+-\s+/)[0]);
    return out.slice(0,2);
  }

  function pget(o,a,b){
    if(!o)return undefined;
    return o[a]!==undefined?o[a]:o[b];
  }

  function providerIds(item){
    return pget(item,'ProviderIds','providerIds')||{};
  }

  function providerLink(ids){
    ids=ids||{};
    var out={};
    var imdb=ids.Imdb||ids.IMDb||ids.imdb;
    var tmdb=ids.Tmdb||ids.TMDb||ids.tmdb;
    if(imdb)out.imdb='https://www.imdb.com/title/'+encodeURIComponent(String(imdb))+'/';
    if(tmdb)out.tmdb='https://www.themoviedb.org/movie/'+encodeURIComponent(String(tmdb));
    return out;
  }

  function qualityFromTopic(title){
    var t=String(title||'');
    var q=[];
    if(/\b(?:2160p|4k|uhd)\b/i.test(t))q.push('4K / UHD');
    else if(/\b1080p\b/i.test(t))q.push('1080p');
    else if(/\b720p\b/i.test(t))q.push('720p');
    if(/\bremux\b/i.test(t))q.push('Remux');
    if(/\b(?:dolby[ .-]?vision|\bdv\b)\b/i.test(t))q.push('Dolby Vision');
    else if(/\bhdr10\+?\b|\bhdr\b/i.test(t))q.push('HDR');
    return q.join(' · ');
  }

  async function localSearch(a,title,year){
    var candidates=titleCandidates(title);
    var cacheKey=candidates.map(norm).join('|')+'|'+String(year||'');
    if(localSearchCache.has(cacheKey))return localSearchCache.get(cacheKey);

    var promise=(async function(){
      if(typeof window.SelectionTvFindLibraryItem==='function'){
        try{
          var indexed=await window.SelectionTvFindLibraryItem({title:title,year:year});
          if(indexed)return indexed;
        }catch(e){}
      }

      var all=[];
      for(var ci=0;ci<candidates.length;ci++){
        try{
          var r=await a.getItems(a.getCurrentUserId(),{
            Recursive:true,
            IncludeItemTypes:'Movie',
            SearchTerm:candidates[ci],
            Fields:'ProviderIds,OriginalTitle,Genres,Overview,People',
            EnableTotalRecordCount:false,
            Limit:10
          });
          all=all.concat(pget(r,'Items','items')||[]);
        }catch(e){}
      }
      var seen={};
      all=all.filter(function(x){
        var id=x.Id||x.id||JSON.stringify([x.Name,x.ProductionYear]);
        if(seen[id])return false;seen[id]=1;return true;
      });
      var norms=candidates.map(norm);
      var scored=all.map(function(x){
        var names=[x.Name,x.name,x.OriginalTitle,x.originalTitle].filter(Boolean).map(norm);
        var y=Number(x.ProductionYear||x.productionYear)||0;
        var score=0;
        norms.forEach(function(nt,idx){
          if(names.indexOf(nt)!==-1)score=Math.max(score,110-idx*8);
          else if(names.some(function(n){return n.includes(nt)||nt.includes(n);}))score=Math.max(score,55-idx*5);
        });
        if(year&&y===Number(year))score+=35;
        else if(year&&y&&Math.abs(y-Number(year))<=1)score+=8;
        return {item:x,score:score};
      }).sort(function(a1,b1){return b1.score-a1.score;});
      return scored.length&&scored[0].score>=80?scored[0].item:null;
    })();

    localSearchCache.set(cacheKey,promise);
    return promise;
  }

  function directorOf(item){
    var people=arr(item.People||item.people);
    return people.filter(function(p){
      return String(p.Type||p.type||'').toLowerCase()==='director';
    }).map(function(p){
      return p.Name||p.name;
    }).filter(Boolean).join(', ');
  }

  function localImage(a,item){
    var tags=item.ImageTags||item.imageTags||{};
    if(!(tags.Primary||tags.primary))return '';
    try{
      return a.getImageUrl(item.Id||item.id,{type:'Primary',maxWidth:500,quality:90});
    }catch(e){
      return '';
    }
  }

  async function remoteSearch(a,title,year){
    var candidates=titleCandidates(title);
    var best=null,bestScore=-1;
    for(var ci=0;ci<candidates.length;ci++){
      try{
        var body={
          SearchInfo:{
            Name:candidates[ci],
            Year:year||null,
            MetadataLanguage:'fr',
            MetadataCountryCode:'FR',
            ProviderIds:{}
          },
          IncludeDisabledProviders:true
        };
        var results=await a.ajax({
          type:'POST',
          url:a.getUrl('Items/RemoteSearch/Movie'),
          data:JSON.stringify(body),
          contentType:'application/json',
          dataType:'json'
        });
        results=arr(results);
        var nt=norm(candidates[ci]);
        results.forEach(function(r){
          var score=0;
          var rn=norm(r.Name||r.name);
          var ry=Number(r.ProductionYear||r.productionYear)||0;
          if(rn===nt)score+=95-ci*6;
          else if(rn.includes(nt)||nt.includes(rn))score+=45-ci*4;
          if(year&&ry===Number(year))score+=35;
          else if(year&&ry&&Math.abs(ry-Number(year))<=1)score+=8;
          if(score>bestScore){bestScore=score;best=r;}
        });
      }catch(e){}
      if(bestScore>=120)break;
    }
    return bestScore>=50?best:null;
  }

  async function localSearchByProvider(a,remote,year){
    if(!remote)return null;
    var ids=providerIds(remote);
    var imdb=String(ids.Imdb||ids.IMDb||ids.imdb||'').toLowerCase();
    var tmdb=String(ids.Tmdb||ids.TMDb||ids.tmdb||'');
    var names=[remote.Name,remote.name,remote.OriginalTitle,remote.originalTitle].filter(Boolean);
    var all=[];

    for(var i=0;i<Math.min(names.length,2);i++){
      try{
        var r=await a.getItems(a.getCurrentUserId(),{
          Recursive:true,
          IncludeItemTypes:'Movie',
          SearchTerm:names[i],
          Fields:'ProviderIds,OriginalTitle,Genres,Overview,People',
          EnableTotalRecordCount:false,
          Limit:12
        });
        all=all.concat(pget(r,'Items','items')||[]);
      }catch(e){}
    }

    var exact=all.find(function(x){
      var p=providerIds(x);
      var xi=String(p.Imdb||p.IMDb||p.imdb||'').toLowerCase();
      var xt=String(p.Tmdb||p.TMDb||p.tmdb||'');
      return (imdb&&xi===imdb)||(tmdb&&xt===tmdb);
    });
    if(exact)return exact;

    var targetNames=names.map(norm);
    return all.find(function(x){
      var y=Number(x.ProductionYear||x.productionYear)||0;
      var n=[x.Name,x.name,x.OriginalTitle,x.originalTitle].filter(Boolean).map(norm);
      return (!year||!y||Math.abs(Number(year)-y)<=1)
        && n.some(function(v){return targetNames.indexOf(v)!==-1;});
    })||null;
  }

  async function publicEnrichment(a,title,year,director,topicTitle,ids){
    try{
      return await a.ajax({
        type:'POST',
        url:a.getUrl('SelectionTv/Enrich'),
        data:JSON.stringify({
          title:title,
          year:year||null,
          director:director||null,
          topicTitle:topicTitle||null,
          imdbId:(ids&&((ids.Imdb||ids.IMDb||ids.imdb)))||null
        }),
        contentType:'application/json',
        dataType:'json'
      });
    }catch(e){
      return {};
    }
  }

  async function enrichOne(upload){
    var a=api();
    var topicTitle=upload.topicTitle||upload.TopicTitle||'';
    var topicUrl=upload.topicUrl||upload.TopicUrl||'';
    var guess=upload.titleGuess||upload.TitleGuess||topicTitle;
    var year=Number(upload.year||upload.Year)||null;
    var activityAt=upload.activityAt||upload.ActivityAt||null;
    var author=upload.author||upload.Author||null;
    var directorGuess=upload.directorGuess||upload.DirectorGuess||null;
    var local=await localSearch(a,guess,year);
    var base=null,ids={};

    if(local){
      ids=providerIds(local);
      base={
        topicTitle:topicTitle,topicUrl:topicUrl,activityAt:activityAt,author:author,
        title:local.Name||local.name||guess,
        titleGuess:guess,
        year:local.ProductionYear||local.productionYear||year,
        director:directorOf(local),
        genre:arr(local.Genres||local.genres).join(' / '),
        overview:local.Overview||local.overview||'',
        image:localImage(a,local),
        links:providerLink(ids),
        quality:qualityFromTopic(topicTitle),
        jellyfinItemId:local.Id||local.id,
        workId:'',
        source:'library',
        ratings:{jellyfin:(local.CommunityRating||local.communityRating||'')}
      };

      // The Selection TV iframe is HTTPS. A poster served by a local HTTP
      // Jellyfin server is blocked as mixed content, so prefer a public HTTPS
      // poster from Jellyfin's remote metadata providers when available.
      if(!/^https:/i.test(base.image||'')){
        var posterRemote=await remoteSearch(a,guess,year);
        if(posterRemote){
          var posterUrl=posterRemote.ImageUrl||posterRemote.imageUrl||'';
          if(/^https:/i.test(posterUrl))base.image=posterUrl;
          var posterIds=providerIds(posterRemote);
          ids={...posterIds,...ids};
          base.links={...providerLink(posterIds),...(base.links||{})};
        }
      }
    }else{
      var remote=await remoteSearch(a,guess,year);
      if(remote){
        var secondLocal=await localSearchByProvider(a,remote,year);
        if(secondLocal){
          local=secondLocal;
          ids=providerIds(local);
          base={
            topicTitle:topicTitle,topicUrl:topicUrl,activityAt:activityAt,author:author,
            title:local.Name||local.name||remote.Name||remote.name||guess,
            titleGuess:guess,
            year:local.ProductionYear||local.productionYear||remote.ProductionYear||remote.productionYear||year,
            director:directorOf(local),
            genre:arr(local.Genres||local.genres).join(' / '),
            overview:local.Overview||local.overview||remote.Overview||remote.overview||'',
            image:localImage(a,local),
            links:{...providerLink(providerIds(remote)),...providerLink(ids)},
            quality:qualityFromTopic(topicTitle),
            jellyfinItemId:local.Id||local.id,
            workId:'',
            source:'library',
            ratings:{jellyfin:(local.CommunityRating||local.communityRating||'')}
          };
          var secondPoster=remote.ImageUrl||remote.imageUrl||'';
          if(/^https:/i.test(secondPoster))base.image=secondPoster;
        }else{
          ids=providerIds(remote);
          base={
            topicTitle:topicTitle,topicUrl:topicUrl,activityAt:activityAt,author:author,
            title:remote.Name||remote.name||guess,
            titleGuess:guess,
            year:remote.ProductionYear||remote.productionYear||year,
            director:'',
            genre:'',
            overview:remote.Overview||remote.overview||'',
            image:remote.ImageUrl||remote.imageUrl||'',
            links:providerLink(ids),
            quality:qualityFromTopic(topicTitle),
            jellyfinItemId:'',
            workId:'',
            source:'remote'
          };
        }
      }else{
        base={
          topicTitle:topicTitle,topicUrl:topicUrl,activityAt:activityAt,author:author,
          title:titleCandidates(guess)[0]||guess,titleGuess:guess,year:year,director:'',genre:'',overview:'',image:'',
          links:{},quality:qualityFromTopic(topicTitle),jellyfinItemId:'',workId:'',source:'unresolved'
        };
      }
    }

    var extra=await publicEnrichment(
      a,
      base.title||guess,
      base.year||year,
      base.director||directorGuess,
      topicTitle,
      ids
    );
    var exLinks=base.links||{};
    var strictImdb=extra.ImdbUrl||extra.imdbUrl;
    var strictSc=extra.SensCritiqueUrl||extra.sensCritiqueUrl;
    if(strictImdb)exLinks.imdb=strictImdb;
    if(strictSc)exLinks.sc=strictSc;
    base.links=exLinks;
    var strictImage=extra.ImageUrl||extra.imageUrl||'';
    if(/^https:/i.test(strictImage))base.image=strictImage;
    else if(/^http:/i.test(base.image||''))base.image='';
    if(base.source==='unresolved'&&(extra.MatchedTitle||extra.matchedTitle)){
      base.title=extra.MatchedTitle||extra.matchedTitle;
    }
    base.director=base.director||directorGuess||'';
    base.ratings={
      ...(base.ratings||{}),
      imdb:extra.ImdbRating||extra.imdbRating||'',
      senscritique:extra.SensCritiqueRating||extra.sensCritiqueRating||''
    };
    return base;
  }

  async function mapLimited(items,limit,fn){
    var out=new Array(items.length);
    var next=0;
    async function worker(){
      while(true){
        var i=next++;
        if(i>=items.length)return;
        out[i]=await fn(items[i],i);
      }
    }
    var workers=[];
    for(var n=0;n<Math.min(limit,items.length);n++)workers.push(worker());
    await Promise.all(workers);
    return out;
  }

  function sendPrivate(payload){
    if(payload)lastPrivatePayload=payload;
    if(frame.contentWindow&&lastPrivatePayload){
      frame.contentWindow.postMessage(lastPrivatePayload,CHILD_ORIGIN);
    }
  }

  async function loadPrivateUploads(){
    if(privateBusy||!hostActive())return;
    var a=api();
    if(!a)return;
    privateBusy=true;
    try{
      var feed=await a.ajax({
        type:'GET',
        url:a.getUrl('SelectionTv/Uploads',{hours:24}),
        dataType:'json'
      });
      var sourceItems=arr(feed.Items||feed.items);

      // Show the private section immediately. Exact metadata enrichment can
      // take time for obscure films and must never hide the whole section.
      var provisional=sourceItems.map(function(upload){
        var topicTitle=upload.topicTitle||upload.TopicTitle||'';
        var guess=upload.titleGuess||upload.TitleGuess||topicTitle;
        return {
          topicTitle:topicTitle,
          topicUrl:upload.topicUrl||upload.TopicUrl||'',
          activityAt:upload.activityAt||upload.ActivityAt||null,
          author:upload.author||upload.Author||null,
          title:guess,
          titleGuess:guess,
          year:Number(upload.year||upload.Year)||null,
          director:upload.directorGuess||upload.DirectorGuess||'',
          genre:'',
          overview:'',
          image:'',
          links:{},
          ratings:{},
          quality:qualityFromTopic(topicTitle),
          jellyfinItemId:'',
          workId:'',
          source:'pending'
        };
      });

      sendPrivate({
        type:'selection-tv:jellyfin-private-uploads',
        version:2,
        phase:'provisional',
        generatedAt:feed.GeneratedAt||feed.generatedAt||new Date().toISOString(),
        windowHours:feed.WindowHours||feed.windowHours||24,
        items:provisional
      });

      if(status&&provisional.length){
        var initialBase=(status.textContent||'').replace(/ · uploads.*$/,'');
        status.textContent=initialBase+' · uploads '+provisional.length+' · enrichissement…';
      }

      var cache=loadEnrichedCache();
      var items=provisional.slice();
      var pending=[];

      sourceItems.forEach(function(upload,i){
        var cached=cache[uploadCacheKey(upload)];
        if(cached){
          items[i]=cached;
        }else{
          pending.push(i);
        }
      });

      if(pending.length!==sourceItems.length){
        sendPrivate({
          type:'selection-tv:jellyfin-private-uploads',
          version:4,
          phase:'cached',
          generatedAt:feed.GeneratedAt||feed.generatedAt||new Date().toISOString(),
          windowHours:feed.WindowHours||feed.windowHours||24,
          items:items
        });
      }

      var nextIndex=0;
      var completed=sourceItems.length-pending.length;

      async function worker(){
        while(true){
          if(!hostActive())return;
          var p=nextIndex++;
          if(p>=pending.length)return;
          var i=pending[p];
          try{
            items[i]=await enrichOne(sourceItems[i]);
            cache[uploadCacheKey(sourceItems[i])]=items[i];
            saveEnrichedCache(cache);
          }catch(e){
            console.warn('Selection TV enrichment failed for item',i,e);
          }
          completed++;
          sendPrivate({
            type:'selection-tv:jellyfin-private-uploads',
            version:4,
            phase:completed===sourceItems.length?'enriched':'progress',
            changedIndex:i,
            completed:completed,
            total:sourceItems.length,
            generatedAt:feed.GeneratedAt||feed.generatedAt||new Date().toISOString(),
            windowHours:feed.WindowHours||feed.windowHours||24,
            items:items
          });
          if(status){
            var progressBase=(status.textContent||'').replace(/ · uploads.*$/,'');
            status.textContent=progressBase+' · uploads '+sourceItems.length+' · '+completed+'/'+sourceItems.length+' enrichis';
          }
        }
      }

      await Promise.all(Array.from({length:Math.min(2,pending.length)},worker));

      if(status&&items.length){
        var base=(status.textContent||'').replace(/ · uploads.*$/,'');
        status.textContent=base+' · uploads '+items.length;
      }
    }catch(err){
      console.warn('Selection TV private uploads unavailable',err);
    }finally{
      privateBusy=false;
    }
  }

  function schedule(){
    clearInterval(privateTimer);
    privateTimer=setInterval(loadPrivateUploads,10*60*1000);
  }

  window.addEventListener('message',function(e){
    if(e.source!==frame.contentWindow||!e.data)return;
    if(e.data.type==='selection-tv:jellyfin-private-ready'){
      if(lastPrivatePayload)sendPrivate();
      else loadPrivateUploads();
    }
  });

  frame.addEventListener('load',function(){
    [250,900,2200].forEach(function(delay){
      setTimeout(function(){
        if(lastPrivatePayload)sendPrivate();
        else loadPrivateUploads();
      },delay);
    });
    schedule();
  });

  setTimeout(loadPrivateUploads,3200);
  schedule();
})();
</script>
