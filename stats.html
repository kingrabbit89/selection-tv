<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Tableau de bord</title><link rel="stylesheet" href="assets/css/site.css?v=20260924-editorial" /><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#f8f4ec;color:#172238;border-radius:0;padding:20px}.stat b{display:block;font:700 36px Georgia,serif}.barrow{display:grid;grid-template-columns:170px 1fr 45px;gap:10px;align-items:center;margin:10px 0;color:#ddd}.bar{height:10px;background:#ffffff17;border-radius:0;overflow:hidden}.bar i{display:block;height:100%;background:#b53d4b;border-radius:0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:120px 1fr 35px}}</style></head><body class="stats-page"><header><div class="wrap top"><div class="brand">SÉLECTION TV</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="calendrier.html">Calendrier</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Tableau de bord</h1><div class="deck">Une vue quantitative des archives : combien d’œuvres, quels réalisateurs reviennent, quels pays et genres apparaissent le plus souvent.</div><div class="stats" id="stats"></div><div class="section-title">Réalisateurs les plus présents</div><div id="directors"></div><div class="section-title">Pays les plus représentés</div><div id="countries"></div></main><script>
fetch('data/works.json').then(r=>r.json()).then(d=>{const w=d.works,known=w.filter(x=>x.director);document.getElementById('stats').innerHTML='<div class="stat"><b>'+w.length+'</b>œuvres indexées</div><div class="stat"><b>'+known.length+'</b>fiches enrichies</div><div class="stat"><b>'+new Set(known.map(x=>x.director)).size+'</b>réalisateurs</div><div class="stat"><b>'+new Set(w.flatMap(x=>(x.occurrences||[]).map(o=>o.week))).size+'</b>semaines</div>';function bars(el,map){const a=[...map].sort((a,b)=>b[1]-a[1]).slice(0,12),max=a[0]?.[1]||1;document.getElementById(el).innerHTML=a.map(([n,c])=>'<div class="barrow"><span>'+n+'</span><div class="bar"><i style="width:'+Math.round(c/max*100)+'%"></i></div><b>'+c+'</b></div>').join('')}const dm=new Map(),cm=new Map();known.forEach(x=>{dm.set(x.director,(dm.get(x.director)||0)+1);x.country.split('/').map(s=>s.trim()).filter(Boolean).forEach(c=>cm.set(c,(cm.get(c)||0)+1))});bars('directors',dm);bars('countries',cm)})
</script></body></html>
