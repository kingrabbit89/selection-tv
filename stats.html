<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Tableau de bord</title><style>
:root{--bg:#171c23;--paper:#f8f4ec;--ink:#172238;--muted:#6d6861;--accent:#b53d4b;--line:#d8d0c5;--gold:#a46d1a;--teal:#2e7773;--blue:#405d87}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#303947,transparent 30%),linear-gradient(#1b212a,#131820);color:#eee;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:#101722ee;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}.wrap{max-width:1180px;margin:auto;padding:18px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 22px Georgia,serif}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:13px}
main{max-width:1180px;margin:auto;padding:48px 24px 80px}h1{font:700 52px/1 Georgia,serif;margin:0 0 10px}.deck{color:#c8c2bb;max-width:850px;line-height:1.5;font-size:16px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#e89aa3;font-weight:900;margin:34px 0 12px}
.panel{background:var(--paper);color:#24262b;border-radius:18px;box-shadow:0 18px 46px #0005;padding:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.controls input,.controls select,.controls button{border:0;background:#f8f4ec;color:var(--ink);border-radius:999px;padding:11px 14px;font-weight:750}.controls input{min-width:300px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--paper);color:#24262b;border-radius:16px;padding:18px;border-top:4px solid var(--accent);box-shadow:0 12px 35px #0004}.card h2,.card h3{font:700 23px/1.06 Georgia,serif;color:var(--ink);margin:0 0 7px}.meta{font-size:12px;line-height:1.45;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:10px;font-weight:850;background:#ebe3d8;color:#635c55;border-radius:999px;padding:5px 8px}.button,.card a.button{display:inline-block;margin-top:10px;text-decoration:none;background:var(--ink);color:white;border-radius:999px;padding:9px 12px;font-weight:850;font-size:12px}.ghost{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)}.empty{color:#c5c0ba;padding:35px 0}.row{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:15px 0;border-top:1px solid #ffffff16}.row:first-child{border-top:0}.row-title{font:700 18px Georgia,serif;color:#efa3ab}.row-body{color:#ddd}.small{font-size:12px;color:#aaa}
@media(max-width:850px){.grid{grid-template-columns:1fr}.controls input{min-width:100%}.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}}
</style><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#f8f4ec;color:#172238;border-radius:16px;padding:20px}.stat b{display:block;font:700 36px Georgia,serif}.barrow{display:grid;grid-template-columns:170px 1fr 45px;gap:10px;align-items:center;margin:10px 0;color:#ddd}.bar{height:10px;background:#ffffff17;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#b53d4b;border-radius:999px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:120px 1fr 35px}}</style></head><body><header><div class="wrap top"><div class="brand">SÉLECTION TV</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="calendrier.html">Calendrier</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Tableau de bord</h1><div class="deck">Une vue quantitative des archives : combien d’œuvres, quels réalisateurs reviennent, quels pays et genres apparaissent le plus souvent.</div><div class="stats" id="stats"></div><div class="section-title">Réalisateurs les plus présents</div><div id="directors"></div><div class="section-title">Pays les plus représentés</div><div id="countries"></div></main><script>
fetch('data/works.json').then(r=>r.json()).then(d=>{const w=d.works,known=w.filter(x=>x.director);document.getElementById('stats').innerHTML='<div class="stat"><b>'+w.length+'</b>œuvres indexées</div><div class="stat"><b>'+known.length+'</b>fiches enrichies</div><div class="stat"><b>'+new Set(known.map(x=>x.director)).size+'</b>réalisateurs</div><div class="stat"><b>'+new Set(w.flatMap(x=>(x.occurrences||[]).map(o=>o.week))).size+'</b>semaines</div>';function bars(el,map){const a=[...map].sort((a,b)=>b[1]-a[1]).slice(0,12),max=a[0]?.[1]||1;document.getElementById(el).innerHTML=a.map(([n,c])=>'<div class="barrow"><span>'+n+'</span><div class="bar"><i style="width:'+Math.round(c/max*100)+'%"></i></div><b>'+c+'</b></div>').join('')}const dm=new Map(),cm=new Map();known.forEach(x=>{dm.set(x.director,(dm.get(x.director)||0)+1);x.country.split('/').map(s=>s.trim()).filter(Boolean).forEach(c=>cm.set(c,(cm.get(c)||0)+1))});bars('directors',dm);bars('countries',cm)})
</script></body></html>
