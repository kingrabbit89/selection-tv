name: Guard direct publication on main

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify manifest.latest transition
        id: classify
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_LATEST="$(git show "$BEFORE:data/manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).latest||''))")"
          NEW_LATEST="$(node -e "const m=require('./data/manifest.json');process.stdout.write(m.latest||'')")"
          echo "old_latest=$OLD_LATEST" >> "$GITHUB_OUTPUT"
          echo "new_latest=$NEW_LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$OLD_LATEST" == "$NEW_LATEST" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if node scripts/validate-promotion-transition.mjs "$BEFORE"; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept exact promotion PR transition
        if: steps.classify.outputs.changed == 'true' && steps.classify.outputs.safe == 'true'
        run: echo "Exact draft-to-published promotion transition accepted."

      - name: Alert on a rejected publication transition
        if: steps.classify.outputs.changed == 'true' && steps.classify.outputs.safe != 'true'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          OLD_LATEST: ${{ steps.classify.outputs.old_latest }}
          NEW_LATEST: ${{ steps.classify.outputs.new_latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Sélection TV: promotion non conforme de $NEW_LATEST"
          BODY="Transition non conforme de $OLD_LATEST vers $NEW_LATEST détectée sur main. Le garde-fou de PR doit bloquer cette transition avant fusion. Aucun push de restauration n'est tenté : main est protégée sans bypass. Ouvrir une PR de restauration et contrôler le déploiement Pages."
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$EXISTING" ]]; then
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "Invalid publication transition; protected main requires a repair PR." >&2
          exit 1
