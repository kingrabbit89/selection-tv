name: Weekly automation watchdog

on:
  schedule:
    - cron: "0 10 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve upcoming issue
        id: target
        run: node scripts/next-target.mjs --github-output

      - name: Verify weekly candidate/publication exists
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.target.outputs.week }}
          BRANCH: ${{ steps.target.outputs.branch }}
          ALREADY_PRESENT: ${{ steps.target.outputs.already_present }}
          EXISTING_STATUS: ${{ steps.target.outputs.existing_status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALREADY_PRESENT" == "true" && "$EXISTING_STATUS" == "published" ]]; then
            node scripts/verify-public-deployment.mjs "$WEEK"
            echo "$WEEK is deployed."
            exit 0
          fi

          PR_URL="$(gh pr list --state open --head "$BRANCH" --json url --jq '.[0].url // empty')"
          PROMOTION_URL="$(gh pr list --state open --head "promote/$WEEK" --json url --jq '.[0].url // empty')"
          if [[ -n "$PR_URL" ]]; then
            echo "::warning::Candidate still awaiting publication: $PR_URL"
          fi
          if [[ -n "$PROMOTION_URL" ]]; then
            echo "::warning::Promotion still awaiting publication: $PROMOTION_URL"
          fi

          if [[ -n "$PR_URL$PROMOTION_URL" ]]; then
            TITLE="Sélection TV automation: $WEEK publication pending"
            BODY="Saturday watchdog: $WEEK is not public. Candidate: $PR_URL. Promotion: $PROMOTION_URL. Inspect required checks and post-merge validation; an open PR is not a successful publication."
            for URL in "$PR_URL" "$PROMOTION_URL"; do
              if [[ -n "$URL" ]]; then
                gh pr checks "$URL" >> "$GITHUB_STEP_SUMMARY" || true
              fi
            done
          elif [[ "$ALREADY_PRESENT" == "true" ]]; then
            TITLE="Sélection TV automation: $WEEK draft is stuck"
            BODY="The upcoming issue $WEEK exists on main with status '$EXISTING_STATUS', but no open auto/$WEEK pull request remains and it has not been promoted. Inspect the promotion workflow and validations."
          else
            TITLE="Sélection TV automation: $WEEK generation missing"
            BODY="No published issue and no open auto/$WEEK pull request were found for the upcoming Saturday-Friday issue. The external research-agent generator should create this candidate before publication."
          fi

          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$EXISTING" ]]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Existing alert issue #$EXISTING"
          fi
          echo "::error::$WEEK is not published; see the alert issue and check summary."
          exit 1

      - name: Watch Android TV upstream base
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PINNED="$(node -e "const c=require('./data/automation-config.json'); process.stdout.write(c.android_tv.upstream_tag)")"
          LATEST="$(gh api 'repos/jellyfin/jellyfin-androidtv/releases?per_page=1' --jq '.[0].tag_name // empty')"
          if [[ -z "$LATEST" || "$LATEST" == "$PINNED" ]]; then
            echo "Android TV upstream pin is current: $PINNED"
            exit 0
          fi
          TITLE="Sélection TV Android TV: upstream $LATEST disponible"
          BODY="L'APK Sélection TV est actuellement construite sur $PINNED, tandis que jellyfin/jellyfin-androidtv publie désormais $LATEST. Tester la migration de l'overlay sur une branche dédiée avant de modifier le pin."
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$EXISTING" ]]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Existing upstream alert #$EXISTING"
          fi
