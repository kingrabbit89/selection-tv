name: Chat S43 artwork review
on:
  push:
    branches: ['transport/chat-s43-20261016']
    paths: ['handoffs/chat-s43-images.json', '.github/workflows/chat-s43-images.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch images, with explicit limits and no authentication
        env:
          OUT: ${{ runner.temp }}/artwork
        run: |
          python3 - <<'PY'
          import json, os, pathlib, hashlib, datetime, urllib.request, urllib.parse, concurrent.futures, re
          out=pathlib.Path(os.environ['OUT']); out.mkdir()
          items=json.load(open('handoffs/chat-s43-images.json'))['items']
          assert len(items)<=100
          allowed={'media.senscritique.com','s3.amazonaws.com','m.media-amazon.com','fr.web.img2.acsta.net','medias.unifrance.org','upload.wikimedia.org','images.telerama.fr','www.arte.tv','api-cdn.arte.tv','static-cdn.arte.tv'}
          def get(it):
            assert re.fullmatch(r'[a-z0-9-]+',it['id'])
            url=it['url']; assert urllib.parse.urlsplit(url).scheme=='https' and urllib.parse.urlsplit(url).hostname in allowed
            r={'id':it['id'],'url':url,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SelectionTV-ArtworkReview/1.0'})
              with urllib.request.urlopen(req,timeout=25) as res:
                assert urllib.parse.urlsplit(res.url).scheme=='https' and urllib.parse.urlsplit(res.url).hostname in allowed
                mime=res.headers.get_content_type(); assert mime.startswith('image/'),mime
                b=res.read(12_000_001); assert len(b)<=12_000_000
                r.update(status=res.status,final_url=res.url,mime=mime,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                ext={'image/png':'.png','image/webp':'.webp'}.get(mime,'.jpg');name=it['id']+ext
                (out/name).write_bytes(b);r['file']=name
            except Exception as e: r.update(status='failed',error=str(e))
            return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: result=list(ex.map(get,items))
          (out/'report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: artwork-${{ github.sha }}
          path: ${{ runner.temp }}/artwork/
          retention-days: 3
          if-no-files-found: error
