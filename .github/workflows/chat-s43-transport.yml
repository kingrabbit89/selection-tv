name: S43 Chat handoff transport
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: chat-s43-transport
  cancel-in-progress: false
jobs:
  sources:
    if: github.head_ref == 'ops/chat-s43-20261016' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public exact sources without authentication or bypass
        shell: bash
        run: |
          mkdir -p /tmp/s43-source-evidence
          python3 <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime,pathlib,concurrent.futures
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/s43-source-evidence')
          sources={
            'potiche':'https://www.unifrance.org/film/30941/potiche',
            'potiche-sc':'https://www.senscritique.com/film/potiche/367361',
            'peter':'https://diaphana.fr/film/peter-von-kant/',
            'peter-arte':'https://www.arte.tv/fr/videos/129843-000-A/peter-von-kant/',
            'deneuve':'https://www.arte.tv/fr/videos/112478-000-A/catherine-deneuve-a-son-image/',
            'hommes':'https://www.festival-cannes.com/f/all-the-president-s-men/',
            'hommes-sc':'https://www.senscritique.com/film/les_hommes_du_president/373061'
          }
          class Parser(HTMLParser):
            def __init__(self):super().__init__();self.meta={};self.text=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='meta' and a.get('content'):self.meta[a.get('property',a.get('name',''))]=a['content']
              if tag=='a' and a.get('href'):self.links.append(a['href'])
            def handle_data(self,d):self.text.append(d)
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'SelectionTV-source-review/1.0','Accept':'text/html,image/*;q=0.9,*/*;q=0.5'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read(6000001)
              if len(data)>6000000:raise ValueError('oversize')
              return data,r.geturl(),r.headers.get('Content-Type',''),r.status
          def one(item):
            key,url=item;row={'key':key,'url':url,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'unavailable'}
            try:
              data,final,mime,status=get(url);row.update(final_url=final,mime=mime,http_status=status,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data));(out/(key+'.html')).write_bytes(data)
              parser=Parser();parser.feed(data.decode('utf-8',errors='replace'));row['meta']=parser.meta;row['image_links']=[x for x in parser.links if any(e in x.lower() for e in ('.jpg','.png','.jpeg','.webp'))][:12]
              text='\n'.join(x.strip() for x in parser.text if x.strip());(out/(key+'.txt')).write_text(text)
              image=parser.meta.get('og:image') or parser.meta.get('twitter:image')
              if image:
                image=urllib.parse.urljoin(final,image);im,ifu,imime,istatus=get(image);row['image']={'url':image,'final_url':ifu,'mime':imime,'http_status':istatus,'bytes':len(im),'sha256':hashlib.sha256(im).hexdigest()}
                if imime.startswith('image/'):(out/(key+'.image')).write_bytes(im)
              row['status']='acquired'
            except Exception as e:row['error']=str(e)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rows=list(ex.map(one,sources.items()))
          (out/'sources.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2));print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chat-s43-source-evidence
          path: /tmp/s43-source-evidence/
          retention-days: 3
          if-no-files-found: error
