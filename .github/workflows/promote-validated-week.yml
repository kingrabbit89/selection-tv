name: Validate merged weekly issue for promotion

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  validate-promotion:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTION_TV_VALIDATE_WEEK: ${{ github.event.pull_request.head.ref }}
      SELECTION_TV_CANDIDATE: "1"
    steps:
      - name: Resolve candidate week
        shell: bash
        run: echo "SELECTION_TV_VALIDATE_WEEK=${SELECTION_TV_VALIDATE_WEEK#auto/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate merged draft
        run: |
          node scripts/validate-automation.mjs
          node scripts/validate-architecture.mjs
          node scripts/validate-publication-candidate.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          node scripts/validate-image-sources.mjs
          node scripts/generation-report.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Revalidate browser, Jellyfin Web and Fire TV model
        run: |
          node scripts/validate-layout.mjs
          node scripts/validate-jellyfin-web.mjs

      - name: Simulate promotion after all checks pass
        run: node scripts/promote-week.mjs "$SELECTION_TV_VALIDATE_WEEK"

      - name: Validate simulated promoted state
        shell: bash
        run: |
          unset SELECTION_TV_VALIDATE_WEEK
          unset SELECTION_TV_CANDIDATE
          node scripts/validate-architecture.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          git diff --check

          EXPECTED="$(printf 'data/manifest.json\ndata/weeks/%s.json\n' "$SELECTION_TV_VALIDATE_WEEK" | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Promotion simulation changed unexpected files:" >&2
            echo "$ACTUAL" >&2
            exit 1
          fi

          {
            echo "## Promotion ready"
            echo
            echo "$SELECTION_TV_VALIDATE_WEEK is valid as a published issue."
            echo "Create promote/$SELECTION_TV_VALIDATE_WEEK from current main, apply only the simulated manifest/week status transition, then merge that promotion PR after its required checks are green."
          } >> "$GITHUB_STEP_SUMMARY"
