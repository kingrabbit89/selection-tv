name: Promote validated weekly issue

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTION_TV_VALIDATE_WEEK: ${{ github.event.pull_request.head.ref }}
      SELECTION_TV_CANDIDATE: "1"
    steps:
      - name: Resolve candidate week
        shell: bash
        run: echo "SELECTION_TV_VALIDATE_WEEK=${SELECTION_TV_VALIDATE_WEEK#auto/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate merged draft
        run: |
          node scripts/validate-automation.mjs
          node scripts/validate-architecture.mjs
          node scripts/validate-publication-candidate.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          node scripts/validate-image-sources.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Revalidate browser and Fire TV model
        run: node scripts/validate-layout.mjs

      - name: Promote only after all checks pass
        run: node scripts/promote-week.mjs "$SELECTION_TV_VALIDATE_WEEK"

      - name: Validate promoted state
        shell: bash
        run: |
          unset SELECTION_TV_VALIDATE_WEEK
          unset SELECTION_TV_CANDIDATE
          node scripts/validate-architecture.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          git diff --check

      - name: Publish promotion commit
        shell: bash
        run: |
          git config user.name "selection-tv-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json "data/weeks/$SELECTION_TV_VALIDATE_WEEK.json"
          git diff --cached --quiet && exit 0
          git commit -m "Publie $SELECTION_TV_VALIDATE_WEEK après validations"
          git push origin HEAD:main
