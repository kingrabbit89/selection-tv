name: Validate merged weekly issue for promotion

on:
  workflow_dispatch:
    inputs:
      week:
        description: Draft week to revalidate on current main
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  validate-promotion:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto/'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTION_TV_VALIDATE_WEEK: ${{ inputs.week || github.event.pull_request.head.ref }}
      SELECTION_TV_CANDIDATE: "1"
    steps:
      - name: Resolve candidate week
        shell: bash
        run: echo "SELECTION_TV_VALIDATE_WEEK=${SELECTION_TV_VALIDATE_WEEK#auto/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate merged draft
        id: data
        run: |
          node scripts/validate-automation.mjs
          node scripts/validate-canonical-identities.mjs
          node scripts/validate-architecture.mjs
          node scripts/validate-publication-candidate.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          node scripts/validate-image-sources.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Revalidate browser, Jellyfin Web and Fire TV model
        id: browser
        run: |
          node scripts/validate-layout.mjs
          node scripts/validate-jellyfin-web.mjs

      - name: Simulate promotion after all checks pass
        run: node scripts/promote-week.mjs "$SELECTION_TV_VALIDATE_WEEK"

      - name: Validate simulated promoted state
        id: promoted
        shell: bash
        run: |
          PROMOTION_WEEK="$SELECTION_TV_VALIDATE_WEEK"
          unset SELECTION_TV_VALIDATE_WEEK
          unset SELECTION_TV_CANDIDATE
          node scripts/validate-architecture.mjs
          node scripts/validate-editorial.mjs
          node scripts/validate-links.mjs
          node scripts/validate-freshness.mjs
          node scripts/validate-reserves.mjs
          git diff --check

          EXPECTED="$(printf 'data/manifest.json\ndata/weeks/%s.json\n' "$PROMOTION_WEEK" | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Promotion simulation changed unexpected files:" >&2
            echo "$ACTUAL" >&2
            exit 1
          fi

          {
            echo "## Promotion ready"
            echo
            echo "$PROMOTION_WEEK is valid as a published issue."
            echo "Create promote/$PROMOTION_WEEK from current main, apply only the simulated manifest/week status transition, then merge that promotion PR after its required checks are green."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the validated base commit
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          fs.writeFileSync('promotion-ready.json',JSON.stringify({
            week:process.env.SELECTION_TV_VALIDATE_WEEK,
            base_sha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()
          }));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-ready-${{ env.SELECTION_TV_VALIDATE_WEEK }}
          path: promotion-ready.json
          retention-days: 14

      - name: Promotion run summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node scripts/generation-report.mjs
          node -e 'const fs=require("fs"); const s=JSON.parse(process.env.STEPS_JSON); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n## Gates\n"+Object.entries(s).map(([k,v])=>"- "+k+": "+v.outcome).join("\n"));'
