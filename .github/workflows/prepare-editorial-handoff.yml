name: Prepare editorial handoff for Chat
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-editorial-handoff.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-handoff-context
          path: handoff-context/
          retention-days: 30
