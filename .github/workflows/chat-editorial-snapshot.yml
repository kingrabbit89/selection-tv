name: Chat editorial snapshot
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/chat-editorial-snapshot.yml, scripts/chat-s43-source-check.py]
permissions:
  contents: read
jobs:
  sources:
    if: github.head_ref == 'handoff/s43-chat-production-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact public publisher pages and preserve dated evidence
        run: python3 scripts/chat-s43-source-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-s43-public-evidence
          path: /tmp/chat-s43-evidence/
          retention-days: 1
