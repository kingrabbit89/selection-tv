name: Build Jellyfin private uploads plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "integrations/jellyfin/private-uploads/**"
      - "assets/js/jellyfin-private-uploads.js"
      - "assets/js/jellyfin-bridge.js"
      - "integrations/jellyfin/selection-tv.html"
      - ".github/workflows/build-jellyfin-private-uploads.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check Jellyfin JavaScript
        run: |
          node --check assets/js/jellyfin-bridge.js
          node --check assets/js/jellyfin-private-uploads.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("integrations/jellyfin/selection-tv.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline script found in selection-tv.html")
          Path("/tmp/selection-tv-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/selection-tv-inline.js

      - name: Restore
        run: dotnet restore integrations/jellyfin/private-uploads/Jellyfin.Plugin.SelectionTvPrivate.csproj

      - name: Build
        run: dotnet build integrations/jellyfin/private-uploads/Jellyfin.Plugin.SelectionTvPrivate.csproj -c Release --no-restore

      - name: Stage plugin
        run: |
          mkdir -p dist/SelectionTvPrivate
          cp integrations/jellyfin/private-uploads/bin/Release/net9.0/Jellyfin.Plugin.SelectionTvPrivate.dll dist/SelectionTvPrivate/
          cp integrations/jellyfin/private-uploads/config.example.json dist/SelectionTvPrivate/config.example.json
          cp integrations/jellyfin/private-uploads/README.md dist/SelectionTvPrivate/README.md
          cp integrations/jellyfin/selection-tv.html dist/SelectionTvPrivate/selection-tv.html

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectionTvPrivate-Jellyfin-10.11
          path: dist/SelectionTvPrivate/
          if-no-files-found: error
