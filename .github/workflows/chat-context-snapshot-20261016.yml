name: Chat production context snapshot 20261016
on:
  push:
    branches: ['chore/chat-production-20261016']
    paths: ['.github/workflows/chat-context-snapshot-20261016.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only committed public repository objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = e7490f2ceb64bfe2d951df3ec8380c6fee2245fc
          test "$(git rev-parse refs/remotes/origin/auto/2026-S43)" = dc90984a8fad7e3c746ab1617b9f400cbce0afb0
          mkdir -p "$RUNNER_TEMP/chat-context"
          git bundle create "$RUNNER_TEMP/chat-context/selection-tv.bundle" refs/remotes/origin/main refs/remotes/origin/auto/2026-S43
          git bundle verify "$RUNNER_TEMP/chat-context/selection-tv.bundle"
          printf '%s\n' 'main=e7490f2ceb64bfe2d951df3ec8380c6fee2245fc' 'candidate=dc90984a8fad7e3c746ab1617b9f400cbce0afb0' > "$RUNNER_TEMP/chat-context/refs.txt"
          cd "$RUNNER_TEMP/chat-context"
          sha256sum selection-tv.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: chat-production-context-20261016
          path: ${{ runner.temp }}/chat-context/
          retention-days: 3
          if-no-files-found: error
