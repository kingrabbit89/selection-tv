name: Validate architecture
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        shell: bash
        run: |
          echo "SELECTION_TV_VALIDATE_WEEK=${GITHUB_HEAD_REF#auto/}" >> "$GITHUB_ENV"
          echo "SELECTION_TV_CANDIDATE=1" >> "$GITHUB_ENV"
      - run: node scripts/validate-automation.mjs
      - run: node scripts/validate-architecture.mjs
      - run: node scripts/validate-publication-candidate.mjs
      - run: node scripts/validate-editorial.mjs
      - run: node scripts/validate-links.mjs
      - run: node scripts/validate-freshness.mjs
      - run: node scripts/validate-reserves.mjs
      - name: Validate remote image sources for candidate
        if: github.event_name == 'pull_request'
        run: node scripts/validate-image-sources.mjs

  browser-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        shell: bash
        run: |
          echo "SELECTION_TV_VALIDATE_WEEK=${GITHUB_HEAD_REF#auto/}" >> "$GITHUB_ENV"
          echo "SELECTION_TV_CANDIDATE=1" >> "$GITHUB_ENV"
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate rendered issues
        run: node scripts/validate-layout.mjs
