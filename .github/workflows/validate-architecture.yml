name: Validate architecture
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  data-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve preparation or complete weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validation-context.mjs
      - name: Prove unchanged published regressions on exact main base
        id: regressions
        if: env.SELECTION_TV_PREPARATION_WEEK != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/preparation-regressions.mjs
      - name: Validate publication transition before merge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-promotion-transition.mjs "$BASE_SHA"
      - name: Require successful revalidation of the exact base
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'promote/')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-promotion-attestation.mjs "${GITHUB_HEAD_REF#promote/}" "$BASE_SHA"
      - run: node --test scripts/test-promotion-transition.mjs scripts/test-editorial-contracts.mjs scripts/test-week-calendar.mjs scripts/test-weekly-watchdog.mjs scripts/test-hybrid-workflow.mjs scripts/test-recover-promotion.mjs scripts/test-editorial-lease.mjs scripts/test-validation-context.mjs scripts/test-editorial-work-packet.mjs scripts/test-preparation-regressions.mjs scripts/editorial-draft.test.mjs scripts/test-html-text.mjs scripts/test-publication-trigger-context.mjs scripts/test-promotion-attestation.mjs
      - name: Test optional paper-source extraction
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python3 scripts/test-editorial-telerama-pdf.py
          python3 scripts/test-editorial-telerama-editorial.py
      - run: node scripts/validate-automation.mjs
      - run: node scripts/validate-canonical-identities.mjs
      - run: node scripts/sync-asset-versions.mjs --check
      - run: node scripts/validate-architecture.mjs
      - run: node --test scripts/test-editorial-progress.mjs scripts/test-editorial-continuation.mjs scripts/test-editorial-large-checkpoint.mjs scripts/test-editorial-task-board.mjs scripts/test-editorial-radar-reconcile.mjs
      - run: node --test scripts/test-editorial-source-collector.mjs scripts/test-editorial-source-import.mjs scripts/test-editorial-production-plan.mjs scripts/test-editorial-production-flow.mjs scripts/test-editorial-telerama-import.mjs scripts/test-editorial-telerama-signals.mjs
      - run: node scripts/validate-publication-candidate.mjs
      - run: node scripts/validate-editorial.mjs
      - run: node scripts/validate-links.mjs
      - run: node scripts/validate-freshness.mjs
      - run: node --test scripts/test-editorial-draft-sections.mjs
      - run: node scripts/validate-reserves.mjs
      - name: Validate remote image sources
        if: steps.regressions.outputs.reused != 'true'
        run: node scripts/validate-image-sources.mjs
      - name: Report gaps before ready (informative, non-certifying)
        if: always() && env.SELECTION_TV_PREPARATION_WEEK != ''
        run: node scripts/preparation-gaps.mjs --json preparation-gaps.json
      - name: Keep gap report for the editorial producer
        if: always() && env.SELECTION_TV_PREPARATION_WEEK != ''
        uses: actions/upload-artifact@v4
        with:
          name: preparation-gaps-${{ env.SELECTION_TV_PREPARATION_WEEK }}
          path: preparation-gaps.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Generation audit summary
        if: always()
        run: node scripts/generation-report.mjs
      - name: Smoke-test current public deployment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          CURRENT="$(git show "$BASE_SHA:data/manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).latest))")"
          node scripts/verify-public-deployment.mjs "$CURRENT"

      - name: Require a complete candidate before merging
        run: node scripts/validation-context.mjs --require-ready

  browser-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve preparation or complete weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validation-context.mjs
      - name: Prove unchanged published regressions on exact main base
        id: regressions
        if: env.SELECTION_TV_PREPARATION_WEEK != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/preparation-regressions.mjs
      - name: Install browser test runtime
        if: steps.regressions.outputs.reused != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate rendered issues
        if: steps.regressions.outputs.reused != 'true'
        run: node scripts/validate-layout.mjs
      - name: Validate Jellyfin Web bridge
        if: steps.regressions.outputs.reused != 'true'
        run: node scripts/validate-jellyfin-web.mjs
