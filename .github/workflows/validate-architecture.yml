name: Validate architecture
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  data-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve preparation or complete weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validation-context.mjs
      - name: Validate publication transition before merge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-promotion-transition.mjs "$BASE_SHA"
      - name: Require successful revalidation of the exact base
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'promote/')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-promotion-attestation.mjs "${GITHUB_HEAD_REF#promote/}" "$BASE_SHA"
      - run: node --test scripts/test-promotion-transition.mjs scripts/test-editorial-contracts.mjs scripts/test-week-calendar.mjs scripts/test-weekly-watchdog.mjs scripts/test-hybrid-workflow.mjs scripts/test-recover-promotion.mjs scripts/test-editorial-lease.mjs scripts/test-validation-context.mjs
      - run: node scripts/validate-automation.mjs
      - run: node scripts/validate-canonical-identities.mjs
      - run: node scripts/sync-asset-versions.mjs --check
      - run: node scripts/validate-architecture.mjs
      - run: node scripts/validate-publication-candidate.mjs
      - run: node scripts/validate-editorial.mjs
      - run: node scripts/validate-links.mjs
      - run: node scripts/validate-freshness.mjs
      - run: node scripts/validate-reserves.mjs
      - name: Validate remote image sources
        run: node scripts/validate-image-sources.mjs
      - name: Generation audit summary
        if: always()
        run: node scripts/generation-report.mjs
      - name: Smoke-test current public deployment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          CURRENT="$(git show "$BASE_SHA:data/manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).latest))")"
          node scripts/verify-public-deployment.mjs "$CURRENT"

      - name: Require a complete candidate before merging
        run: node scripts/validation-context.mjs --require-ready

  browser-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve preparation or complete weekly candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validation-context.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate rendered issues
        run: node scripts/validate-layout.mjs
      - name: Validate Jellyfin Web bridge
        run: node scripts/validate-jellyfin-web.mjs
