<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Calendrier</title><style>
:root{--bg:#171c23;--paper:#f8f4ec;--ink:#172238;--accent:#b53d4b;--line:#d8d0c5;--muted:#6d6861}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#303947,transparent 30%),linear-gradient(#1b212a,#131820);color:#eee}header{position:sticky;top:0;z-index:20;background:#101722ee;border-bottom:1px solid #ffffff14}.wrap{max-width:1180px;margin:auto;padding:18px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:700 22px Georgia,serif}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:13px}main{max-width:1180px;margin:auto;padding:48px 24px 80px}h1{font:700 52px Georgia,serif;margin:0}.deck{color:#c8c2bb;max-width:820px;line-height:1.5;margin:8px 0 22px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.controls button{border:1px solid #ffffff22;background:#ffffff0c;color:#ddd;border-radius:999px;padding:8px 11px;font-weight:850;cursor:pointer}.controls button.active{background:#b53d4b;color:white;border-color:#b53d4b}.timeline{display:grid;grid-template-columns:130px 1fr;gap:0}.date{font:700 18px Georgia,serif;padding:18px 18px 18px 0;color:#e7a0a7;border-top:1px solid #ffffff18}.events{border-top:1px solid #ffffff18;padding:14px 0}.event{display:grid;grid-template-columns:135px 1fr;gap:16px;background:#f8f4ec;color:#24262b;border-radius:12px;padding:14px 16px;margin-bottom:9px}.kind{font-size:10px;font-weight:900;text-transform:uppercase;color:#8a3d48}.event b{font-family:Georgia,serif;font-size:18px;color:#172238}.event span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty{display:none;color:#bbb;padding:35px 0}@media(max-width:700px){.timeline{grid-template-columns:1fr}.date{padding-bottom:6px}.event{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="wrap top"><div class="brand">SÉLECTION TV · CALENDRIER</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Calendrier de veille</h1><div class="deck">Vue mensuelle des diffusions importantes, sorties physiques, arrivées streaming et expirations connues. Les dates sont filtrables par type.</div><div class="controls"><button data-kind="" class="active">Tout</button><button data-kind="TV">TV</button><button data-kind="Blu-ray">Blu-ray / UHD</button><button data-kind="Streaming">Streaming</button><button data-kind="Expiration">Expirations</button><button data-month="2026-09">Septembre</button><button data-month="2026-10">Octobre</button></div><div id="timeline" class="timeline"></div><div id="empty" class="empty">Aucun événement dans ce filtre.</div></main><script>
let KIND='',MONTH='';const fixed=[
{date:'2026-09-26',kind:'TV',title:'Lost in Translation',detail:'23:58 · Ciné+ Festival'},
{date:'2026-09-27',kind:'TV',title:'Le Parrain, épilogue : la mort de Michael Corleone',detail:'21:00 · Arte'},
{date:'2026-09-28',kind:'TV',title:'Paris, Texas',detail:'00:02 · Ciné+ Classic'},
{date:'2026-09-29',kind:'TV',title:'Tár',detail:'01:07 · Ciné+ OCS'},
{date:'2026-09-30',kind:'TV',title:'Sympathy for Mr. Vengeance',detail:'00:33 · Ciné+ Festival'},
{date:'2026-10-01',kind:'TV',title:'A Scene at the Sea',detail:'03:49 · Ciné+ Festival'},
{date:'2026-10-02',kind:'TV',title:'Le Jardin des Finzi-Contini',detail:'22:45 · Ciné+ Classic'}
];let EVENTS=[...fixed];fetch('data/releases.json').then(r=>r.json()).then(d=>{EVENTS.push(...d.physical.map(x=>({date:x.date,kind:'Blu-ray',title:x.work,detail:x.format+' · '+x.editor})),...d.streaming.map(x=>({date:x.date,kind:'Streaming',title:x.work,detail:x.platform})),...d.expirations.map(x=>({date:x.date,kind:'Expiration',title:x.work,detail:'Quitte '+x.platform})));render()});
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function render(){const rows=EVENTS.filter(x=>(!KIND||x.kind===KIND)&&(!MONTH||x.date.startsWith(MONTH))).sort((a,b)=>a.date.localeCompare(b.date));const groups=new Map();rows.forEach(x=>{if(!groups.has(x.date))groups.set(x.date,[]);groups.get(x.date).push(x)});document.getElementById('timeline').innerHTML=[...groups].map(([d,ev])=>'<div class="date">'+fmt(d)+'</div><div class="events">'+ev.map(x=>'<div class="event"><div class="kind">'+x.kind+'</div><div><b>'+x.title+'</b><span>'+x.detail+'</span></div></div>').join('')+'</div>').join('');document.getElementById('empty').style.display=rows.length?'none':'block'}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{KIND=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{MONTH=MONTH===b.dataset.month?'':b.dataset.month;document.querySelectorAll('[data-month]').forEach(x=>x.classList.toggle('active',MONTH===x.dataset.month));render()});render();
</script></body></html>
