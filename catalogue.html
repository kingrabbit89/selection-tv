<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Catalogue</title><style>
:root{--bg:#171c23;--paper:#f8f4ec;--ink:#172238;--muted:#6c675f;--accent:#b53d4b;--line:#d7cec1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#303947,transparent 30%),linear-gradient(#1b212a,#131820);color:#eee}
header{position:sticky;top:0;z-index:20;background:#101722ee;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}.wrap{max-width:1180px;margin:auto;padding:18px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 22px Georgia,serif}.nav a{color:#fff;text-decoration:none;font-weight:800;margin-left:16px;font-size:13px}
main{max-width:1180px;margin:auto;padding:48px 24px 80px}h1{font:700 52px/1 Georgia,serif;margin:0 0 10px}.deck{color:#c8c2bb;max-width:800px;line-height:1.5}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.controls input,.controls select{background:#f8f4ec;border:0;border-radius:999px;padding:11px 15px;font-weight:700;color:#172238}.controls input{min-width:320px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#f8f4ec;color:#24262b;border-radius:16px;padding:20px;box-shadow:0 16px 40px #0005;border-top:4px solid var(--accent)}.card h2{font:700 24px/1.05 Georgia,serif;color:#172238;margin:0 0 7px}.meta{font-size:12px;color:var(--muted);line-height:1.4}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{font-size:10px;font-weight:900;background:#ebe3d8;color:#635c55;border-radius:999px;padding:5px 8px}.history{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px;line-height:1.45}.card a{display:inline-block;margin-top:10px;color:#172238;font-weight:900;text-decoration:none}.empty{display:none;color:#bbb;padding:40px 0}
@media(max-width:850px){.grid{grid-template-columns:1fr}.controls input{min-width:100%}}
</style></head><body><header><div class="wrap top"><div class="brand">SÉLECTION TV · CATALOGUE</div><nav class="nav"><a href="./">Accueil</a><a href="calendrier.html">Calendrier</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Catalogue des œuvres repérées</h1><div class="deck">Une base permanente en cours d’alimentation : lorsqu’un film revient dans une autre semaine, son historique peut être enrichi au lieu de repartir de zéro.</div><div class="controls"><input id="q" placeholder="Film, réalisateur, pays, genre…"><select id="period"><option value="">Toutes les semaines</option><option>S40</option><option>S39</option><option>S38</option><option>S37</option></select><select id="kind"><option value="">Tous les types</option><option>TV</option><option>Radar</option><option>Blu-ray</option><option>Streaming</option></select></div><div class="grid" id="grid"></div><div class="empty" id="empty">Aucun résultat.</div></main><script>
const WORKS=[{"title":"Paris, Texas","director":"Wim Wenders","year":"1984","country":"RFA / France","genre":"Drame","week":"S40","kind":"TV","history":"Ciné+ Classic · diffusion S40"},{"title":"Tár","director":"Todd Field","year":"2022","country":"États-Unis","genre":"Drame","week":"S40","kind":"TV","history":"Ciné+ OCS · diffusion S40"},{"title":"A Scene at the Sea","director":"Takeshi Kitano","year":"1991","country":"Japon","genre":"Drame / romance","week":"S40","kind":"TV","history":"Ciné+ Festival · rareté S40"},{"title":"Sympathy for Mr. Vengeance","director":"Park Chan-wook","year":"2002","country":"Corée du Sud","genre":"Thriller / drame","week":"S40","kind":"TV","history":"Ciné+ Festival · S40"},{"title":"Le Jardin des Finzi-Contini","director":"Vittorio De Sica","year":"1970","country":"Italie / RFA","genre":"Drame historique","week":"S40","kind":"TV","history":"Ciné+ Classic · S40"},{"title":"Pour une poignée de dollars","director":"Sergio Leone","year":"1964","country":"Italie / Espagne / RFA","genre":"Western","week":"S40","kind":"Blu-ray","history":"Nouvelle édition 4K restaurée · septembre 2026"},{"title":"28 jours plus tard","director":"Danny Boyle","year":"2002","country":"Royaume-Uni","genre":"Horreur / SF","week":"S40","kind":"Blu-ray","history":"Blu-ray 4K · septembre 2026"},{"title":"À l’est d’Éden","director":"Zoe Kazan","year":"2026","country":"États-Unis","genre":"Mini-série dramatique","week":"S40","kind":"Streaming","history":"Netflix · 1er octobre 2026"},{"title":"The Last First : le K2 en hiver","director":"Amir Bar-Lev","year":"2026","country":"États-Unis / Royaume-Uni","genre":"Documentaire","week":"S40","kind":"Streaming","history":"Apple TV · 2 octobre 2026"},{"title":"Le Parrain II","director":"Francis Ford Coppola","year":"1974","country":"États-Unis","genre":"Crime / drame","week":"S39","kind":"TV","history":"Arte · 20 septembre 2026"},{"title":"Black Rain","director":"Ridley Scott","year":"1989","country":"États-Unis","genre":"Policier / thriller","week":"S39","kind":"TV","history":"Arte · 21 septembre 2026"},{"title":"Une affaire privée","director":"Guillaume Nicloux","year":"2002","country":"France","genre":"Policier","week":"S39","kind":"TV","history":"Arte · 23 septembre 2026"},{"title":"Phoenix","director":"Christian Petzold","year":"2014","country":"Allemagne","genre":"Drame","week":"S38","kind":"TV","history":"Arte · 12 septembre 2026"},{"title":"Two Lovers","director":"James Gray","year":"2008","country":"États-Unis","genre":"Drame / romance","week":"S38","kind":"TV","history":"Arte · 16 septembre 2026"},{"title":"Julia","director":"Fred Zinnemann","year":"1977","country":"États-Unis","genre":"Drame","week":"S38","kind":"TV","history":"Arte · 14 septembre 2026"},{"title":"Bon voyage","director":"Jean-Paul Rappeneau","year":"2003","country":"France","genre":"Comédie dramatique","week":"S37","kind":"TV","history":"Arte · S37 puis S38"},{"title":"Boîte noire","director":"Yann Gozlan","year":"2021","country":"France","genre":"Thriller","week":"S37","kind":"TV","history":"France 2 · 6 septembre 2026"},{"title":"The Queen","director":"Stephen Frears","year":"2006","country":"Royaume-Uni","genre":"Drame","week":"S37","kind":"TV","history":"France 5 · 11 septembre 2026"},{"title":"L’Armée des 12 singes","director":"Terry Gilliam","year":"1995","country":"États-Unis","genre":"SF / thriller","week":"S39","kind":"Radar","history":"Radar 1080p · semaine S39"},{"title":"Volver","director":"Pedro Almodóvar","year":"2006","country":"Espagne","genre":"Comédie dramatique","week":"S40","kind":"Radar","history":"Radar 1080p · semaine S40"}];
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const grid=document.getElementById('grid'),q=document.getElementById('q'),period=document.getElementById('period'),kind=document.getElementById('kind');
function render(){const query=norm(q.value),w=period.value,k=kind.value;const rows=WORKS.filter(x=>(!w||x.week===w)&&(!k||x.kind===k)&&(!query||norm(Object.values(x).join(' ')).includes(query)));grid.innerHTML=rows.map(x=>`<article class="card"><h2>${x.title}</h2><div class="meta"><b>${x.director}</b> · ${x.year} · ${x.country}<br>${x.genre}</div><div class="tags"><span class="tag">${x.week}</span><span class="tag">${x.kind}</span></div><div class="history"><b>Historique :</b> ${x.history}</div><a href="semaines/2026-${x.week}/">Voir le numéro →</a></article>`).join('');document.getElementById('empty').style.display=rows.length?'none':'block'}q.oninput=period.onchange=kind.onchange=render;render();
</script></body></html>
