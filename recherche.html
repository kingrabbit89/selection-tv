<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Recherche globale</title><link rel="stylesheet" href="assets/css/site.css?v=20260924-editorial" /></head><body class="recherche-page"><header><div class="wrap top"><div class="brand">SÉLECTION TV</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="calendrier.html">Calendrier</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Recherche globale</h1><div class="deck">Recherche dans les œuvres repérées des numéros S37 à S40, avec accès direct aux semaines où elles apparaissent. La base s’enrichira automatiquement avec les prochains numéros.</div><div class="controls"><input id="q" autofocus placeholder="Film, série, documentaire, réalisateur…"><select id="week"><option value="">Toutes les semaines</option><option>S40</option><option>S39</option><option>S38</option><option>S37</option></select><select id="kind"><option value="">Toutes les provenances</option><option>TV</option><option>Streaming</option><option>Blu-ray</option><option>Radar</option><option>Archive</option></select></div><div id="count" class="small"></div><div class="grid" id="grid"></div></main><script src="assets/js/seen-registry.js?v=20260924-catalogseen1"></script><script>
let DATA=[];const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
fetch('data/works.json').then(r=>r.json()).then(d=>{DATA=d.works;render()});
const q=document.getElementById('q'),week=document.getElementById('week'),kind=document.getElementById('kind'),grid=document.getElementById('grid');
function render(){const z=norm(q.value),w=week.value,k=kind.value,R=window.SelectionTVSeenRegistry;const rows=DATA.filter(x=>(!z||norm([x.title,x.director,x.year,x.country,x.genre,x.history].join(' ')).includes(z))&&(!w||(x.occurrences||[]).some(o=>o.week===w))&&(!k||x.kind===k));document.getElementById('count').textContent=rows.length+' résultat'+(rows.length>1?'s':'');grid.innerHTML=rows.slice(0,120).map(x=>{const on=!!R?.isSeen(x.title,x.id);return '<article class="card"><h2>'+x.title+'</h2><div class="meta">'+([x.director,x.year,x.country,x.genre].filter(Boolean).join(' · ')||'Métadonnées à compléter')+'</div><div class="tags"><span class="tag">'+x.kind+'</span><span class="tag">'+x.rarity+'</span></div><div class="meta"><b>Présence :</b> '+(x.occurrences||[]).map(o=>'<a href="'+o.url+'" style="color:#172238;font-weight:850">'+o.week+'</a>').join(' · ')+'</div><a class="button" href="oeuvre.html?id='+encodeURIComponent(x.id)+'">Fiche permanente →</a><button class="button ghost seen-btn '+(on?'seen-on':'')+'" data-work="'+encodeURIComponent(x.id)+'">'+(on?'✓ Vu':'Vu')+'</button></article>'}).join('');grid.querySelectorAll('.seen-btn').forEach(b=>b.onclick=()=>{const x=DATA.find(w=>w.id===decodeURIComponent(b.dataset.work));if(!x)return;R.toggle(x.title,x.id);render()})}
q.oninput=week.onchange=kind.onchange=render;document.addEventListener('selectiontv:seenchange',render);
</script><script defer src="assets/js/analytics.js?v=20260925-analytics1"></script></body></html>
