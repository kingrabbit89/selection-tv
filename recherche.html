<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Recherche globale</title><style>
:root{--bg:#171c23;--paper:#f8f4ec;--ink:#172238;--muted:#6d6861;--accent:#b53d4b;--line:#d8d0c5;--gold:#a46d1a;--teal:#2e7773;--blue:#405d87}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#303947,transparent 30%),linear-gradient(#1b212a,#131820);color:#eee;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:#101722ee;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}.wrap{max-width:1180px;margin:auto;padding:18px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 22px Georgia,serif}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:13px}
main{max-width:1180px;margin:auto;padding:48px 24px 80px}h1{font:700 52px/1 Georgia,serif;margin:0 0 10px}.deck{color:#c8c2bb;max-width:850px;line-height:1.5;font-size:16px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#e89aa3;font-weight:900;margin:34px 0 12px}
.panel{background:var(--paper);color:#24262b;border-radius:18px;box-shadow:0 18px 46px #0005;padding:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.controls input,.controls select,.controls button{border:0;background:#f8f4ec;color:var(--ink);border-radius:999px;padding:11px 14px;font-weight:750}.controls input{min-width:300px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--paper);color:#24262b;border-radius:16px;padding:18px;border-top:4px solid var(--accent);box-shadow:0 12px 35px #0004}.card h2,.card h3{font:700 23px/1.06 Georgia,serif;color:var(--ink);margin:0 0 7px}.meta{font-size:12px;line-height:1.45;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:10px;font-weight:850;background:#ebe3d8;color:#635c55;border-radius:999px;padding:5px 8px}.button,.card a.button{display:inline-block;margin-top:10px;text-decoration:none;background:var(--ink);color:white;border-radius:999px;padding:9px 12px;font-weight:850;font-size:12px;border:0;cursor:pointer}.seen-btn.seen-on{background:#314356!important;color:#fff!important}.seen-btn{margin-left:6px}.ghost{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)}.empty{color:#c5c0ba;padding:35px 0}.row{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:15px 0;border-top:1px solid #ffffff16}.row:first-child{border-top:0}.row-title{font:700 18px Georgia,serif;color:#efa3ab}.row-body{color:#ddd}.small{font-size:12px;color:#aaa}
@media(max-width:850px){.grid{grid-template-columns:1fr}.controls input{min-width:100%}.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap top"><div class="brand">SÉLECTION TV</div><nav class="nav"><a href="./">Accueil</a><a href="recherche.html">Recherche</a><a href="catalogue.html">Catalogue</a><a href="realisateurs.html">Réalisateurs</a><a href="calendrier.html">Calendrier</a><a href="best-of.html">Repérages</a><a href="patrimoine.html">Patrimoine</a><a href="a-recuperer.html">Ma liste</a></nav></div></header><main><h1>Recherche globale</h1><div class="deck">Recherche dans les œuvres repérées des numéros S37 à S40, avec accès direct aux semaines où elles apparaissent. La base s’enrichira automatiquement avec les prochains numéros.</div><div class="controls"><input id="q" autofocus placeholder="Film, série, documentaire, réalisateur…"><select id="week"><option value="">Toutes les semaines</option><option>S40</option><option>S39</option><option>S38</option><option>S37</option></select><select id="kind"><option value="">Toutes les provenances</option><option>TV</option><option>Streaming</option><option>Blu-ray</option><option>Radar</option><option>Archive</option></select></div><div id="count" class="small"></div><div class="grid" id="grid"></div></main><script src="assets/js/seen-registry.js?v=20260924-catalogseen1"></script><script>
let DATA=[];const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
fetch('data/works.json').then(r=>r.json()).then(d=>{DATA=d.works;render()});
const q=document.getElementById('q'),week=document.getElementById('week'),kind=document.getElementById('kind'),grid=document.getElementById('grid');
function render(){const z=norm(q.value),w=week.value,k=kind.value,R=window.SelectionTVSeenRegistry;const rows=DATA.filter(x=>(!z||norm([x.title,x.director,x.year,x.country,x.genre,x.history].join(' ')).includes(z))&&(!w||(x.occurrences||[]).some(o=>o.week===w))&&(!k||x.kind===k));document.getElementById('count').textContent=rows.length+' résultat'+(rows.length>1?'s':'');grid.innerHTML=rows.slice(0,120).map(x=>{const on=!!R?.isSeen(x.title,x.id);return '<article class="card"><h2>'+x.title+'</h2><div class="meta">'+([x.director,x.year,x.country,x.genre].filter(Boolean).join(' · ')||'Métadonnées à compléter')+'</div><div class="tags"><span class="tag">'+x.kind+'</span><span class="tag">'+x.rarity+'</span></div><div class="meta"><b>Présence :</b> '+(x.occurrences||[]).map(o=>'<a href="'+o.url+'" style="color:#172238;font-weight:850">'+o.week+'</a>').join(' · ')+'</div><a class="button" href="oeuvre.html?id='+encodeURIComponent(x.id)+'">Fiche permanente →</a><button class="button ghost seen-btn '+(on?'seen-on':'')+'" data-work="'+encodeURIComponent(x.id)+'">'+(on?'✓ Vu':'Vu')+'</button></article>'}).join('');grid.querySelectorAll('.seen-btn').forEach(b=>b.onclick=()=>{const x=DATA.find(w=>w.id===decodeURIComponent(b.dataset.work));if(!x)return;R.toggle(x.title,x.id);render()})}
q.oninput=week.onchange=kind.onchange=render;document.addEventListener('selectiontv:seenchange',render);
</script></body></html>
