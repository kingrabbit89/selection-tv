<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection TV — Dernier numéro</title></head>
<body style="margin:0;background:#171c23;color:#fff;font-family:Arial,sans-serif">
<div style="padding:2rem">Chargement du dernier numéro…</div>
<script>
fetch('data/manifest.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(m=>{
   const w=(m.weeks||[]).find(x=>x.week===m.latest)||(m.weeks||[])[0];
   if(!w?.path)throw new Error('Numéro introuvable');
   const target=new URL(w.path,location.href);
   const params=new URLSearchParams(location.search);
   if(params.get('tv')==='1')target.searchParams.set('tv','1');
   location.replace(target.href);
 })
 .catch(()=>{location.replace('./')});
</script>
</body></html>
